name: Debug folder structure

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Debug folder structure
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Files and folders at root:"
          ls -la
          echo ""
          echo "If there is a subfolder, let's see inside it (if any):"
          for dir in */; do
            echo "--- Inside $dir ---"
            ls -la "$dir"
          done
