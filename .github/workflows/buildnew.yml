name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: shoptrack_clean   # 👈 change to your folder name

      - name: Build APK (debug)
        run: flutter build apk --debug --no-tree-shake-icons --android-skip-build-dependency-validation
        working-directory: shoptrack_clean   # 👈 same here

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: shoptrack_clean/build/app/outputs/flutter-apk/app-debug.apk
